# electron-builder.yml

appId: com.simxel.pos
productName: Simxel
copyright: Copyright © 2026 Simxel

directories:
  output: release
  buildResources: assets

# electron-vite outputs to out/ — not dist/ or dist-electron/
files:
  - out/main/**
  - out/preload/**
  - out/renderer/**
  - package.json

extraResources:
  # Bundled backend JS (dist/server.js)
  - from: ../Simxel/dist
    to: backend
    filter:
      - "**/*.js"
      - "**/*.json"
      - "!**/*.test.js"

  # Prisma migrations
  - from: ../Simxel/prisma
    to: backend/prisma
    filter:
      - "**/*"

  # Prisma client (generated native addon)
  - from: ../Simxel/node_modules/@prisma
    to: backend/node_modules/@prisma

  - from: ../Simxel/node_modules/.prisma
    to: backend/node_modules/.prisma

  # pdfkit — kept external from esbuild bundle because it loads font metrics
  # from disk at runtime (relative to its own package location).
  # All pdfkit sub-dependencies are pure JS and must also be included.
  - from: ../Simxel/node_modules/pdfkit
    to: backend/node_modules/pdfkit

  - from: ../Simxel/node_modules/fontkit
    to: backend/node_modules/fontkit

  - from: ../Simxel/node_modules/linebreak
    to: backend/node_modules/linebreak

  - from: ../Simxel/node_modules/png-js
    to: backend/node_modules/png-js

  - from: ../Simxel/node_modules/js-md5
    to: backend/node_modules/js-md5

  - from: ../Simxel/node_modules/@noble
    to: backend/node_modules/@noble

  # fontkit's own sub-dependencies
  - from: ../Simxel/node_modules/restructure
    to: backend/node_modules/restructure

  - from: ../Simxel/node_modules/dfa
    to: backend/node_modules/dfa

  - from: ../Simxel/node_modules/unicode-properties
    to: backend/node_modules/unicode-properties

  - from: ../Simxel/node_modules/unicode-trie
    to: backend/node_modules/unicode-trie

  - from: ../Simxel/node_modules/tiny-inflate
    to: backend/node_modules/tiny-inflate

  - from: ../Simxel/node_modules/brotli
    to: backend/node_modules/brotli


win:
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/simxel_logo.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: assets/simxel_logo.ico
  uninstallerIcon: assets/simxel_logo.ico
  shortcutName: Simxel
  createDesktopShortcut: true
  createStartMenuShortcut: true

mac:
  target:
    - dmg
  icon: assets/icon.icns
  category: public.app-category.business

linux:
  target:
    - AppImage
  icon: assets/icon.png
  category: Office

publish:
  provider: github
  owner: Yannsamir22
  repo: POS_Simxel
  private: false